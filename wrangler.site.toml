# Game Worker: the game, same-origin rooms and the leaderboard.
# Keep this separate from wrangler.toml (the room relay). The Pages copy of
# the game (wrangler.pages.toml) calls this Worker's /api/board.
name = "squiggle-cup"
main = "worker/site.mjs"
compatibility_date = "2026-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"

# Preserve the existing Worker's Durable Object and support same-origin rooms.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Board"]
