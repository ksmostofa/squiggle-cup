# Room relay (worker/index.mjs). The game itself deploys to Cloudflare Pages
# as the project "squiggle-cup"; see `npm run deploy`.
name = "squiggle-cup-relay"
main = "worker/index.mjs"
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]
